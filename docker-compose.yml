services:
  mock-api:
    build:
      context: ./initial_docs/mock-api
    environment:
      PORT: "4000"
    ports:
      - "${MOCK_API_PORT:-4000}:4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/salud').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 2s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        DOTNET_RUNTIME_IMAGE: ${DOTNET_RUNTIME_IMAGE:-mcr.microsoft.com/dotnet/aspnet:8.0}
      secrets:
        - docker-ca
    environment:
      ASPNETCORE_URLS: http://+:8080
      DOTNET_ROLL_FORWARD: Major
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Define GEMINI_API_KEY en .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      MockApi__BaseUrl: ${MOCK_API_URL:-http://mock-api:4000/}
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    depends_on:
      mock-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:20-alpine}
      secrets:
        - source: docker-ca
          target: docker-ca
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-5000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  docker-e2e:
    profiles: ["test"]
    build:
      context: ./docker-e2e
    environment:
      BACKEND_URL: http://backend:8080/
      FRONTEND_URL: http://frontend:5173/
      MOCK_API_URL: ${MOCK_API_URL:-http://mock-api:4000/}
      E2E_TIMEOUT_MS: ${E2E_TIMEOUT_MS:-120000}
    depends_on:
      mock-api:
        condition: service_healthy
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

secrets:
  docker-ca:
    file: ${DOCKER_CA_CERT_PATH:-.local-certs/empty.pem}
